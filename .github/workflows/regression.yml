name: regression

# Build the release binary and run the test suite and smoke checks against the
# demos in `tests/fixtures/`.
#
# The tracked demos in `tests/fixtures/` are always checked:
#   - unit tests (debug), then the CLI contract tests and golden-output
#     snapshots (release);
#   - `demoscope --check tests/fixtures` (no FAIL allowed; WARN is reported);
#   - scripts/smoke-run.sh: --summary, --check and --html on every fixture, and
#     a syntax check of each page's script;
#   - each viewer is loaded in headless Chromium and any JavaScript error fails
#     the run (scripts/check-viewer.sh);
#   - the wasm bundle is built and must return the same HTML as the CLI
#     (scripts/check-wasm.mjs).
#
# The private demo corpus is NOT in the repo. Put it under `DEMOS TESTING/` (or
# set the `DEMOS_DIR` env var) to run the corpus smoke-run and the reference-demo
# stats; without it those two steps are skipped, with a notice in the run.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Lint (deny warnings)
        run: cargo build --release 2>&1 | tee build.log
            && ! grep -E "^warning" build.log

      # Unit tests stay in debug mode, which keeps overflow checks on (they have
      # caught real walker bugs). The CLI contract and golden tests decode every
      # fixture several times, so they run in release mode: about 5 s instead of
      # about 30 s, with the same results.
      - name: Unit tests (debug)
        run: cargo test --lib --bins

      - name: CLI contract and golden snapshot tests (release)
        run: cargo test --release --test cli_contract --test golden

      - name: Decode check over the fixtures (no FAIL)
        run: ./target/release/demoscope --check tests/fixtures

      - name: Viewer runtime check (headless Chromium)
        env:
          PLAYWRIGHT_WITH_DEPS: "1"
        run: ./scripts/check-viewer.sh

      - name: Smoke-run on the fixtures
        run: ./scripts/smoke-run.sh tests/fixtures

      # The private corpus (`DEMOS TESTING/`, or $DEMOS_DIR) is not in the repo, so
      # on GitHub the next two steps are skipped. Say so, instead of passing as if
      # they had run.
      - name: Detect the private demo corpus
        id: corpus
        shell: bash
        run: |
          dir="${DEMOS_DIR:-DEMOS TESTING}"
          if [ -d "$dir" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            echo "Private corpus found at '$dir'."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Private corpus absent::No demo corpus at '$dir': the corpus smoke-run and the reference-demo stats were SKIPPED. Only tests/fixtures/ was exercised."
          fi

      - name: Smoke-run on the private corpus
        if: steps.corpus.outputs.present == 'true'
        run: ./scripts/smoke-run.sh "${{ steps.corpus.outputs.dir }}"

      - name: Reference-demo parse stats (private corpus)
        if: steps.corpus.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Assert the entity / sample counts of one known-good reference demo
          # haven't drifted. Numbers track what was current at the time of
          # writing; update them when the decoder intentionally changes behaviour.
          ref="${{ steps.corpus.outputs.dir }}/2025-07-18_10-13-29.dem"
          [ -e "$ref" ] || { echo "FAIL: reference demo '$ref' is missing from the corpus"; exit 1; }
          out=$(./target/release/demoscope "$ref" --html /tmp/ref.html 2>&1)
          echo "$out"
          # Counts as of 2026-05-28: 3 entities, 12637 samples, 3 named,
          # 113 life transitions, 1183 yaw samples, 90 weapon switches, 8
          # weapon classes. Loose-match the first half - keeping a check on
          # the full string would require frequent updates as new SendProps
          # are added; entity / sample / life counts are the meaningful ones.
          echo "$out" | grep -E "3 entities, 12637 samples, 3 named, 113 life transitions" \
            || { echo "Reference demo decode drifted!"; exit 1; }

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI version must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3}' Cargo.lock)
          [ -n "$v" ] || { echo "wasm-bindgen not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build native binary (for the parity check)
        run: cargo build --release

      - name: Build WASM bundle
        run: bash scripts/build-wasm.sh

      - name: Smoke test (wasm output must equal the CLI's)
        run: node scripts/check-wasm.mjs
