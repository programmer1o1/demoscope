name: Release

# A `v*` tag push builds, tests and publishes a release. Running the workflow by
# hand (Actions > Release > Run workflow) is a rehearsal: it runs everything up to
# and including the release-notes extraction (for the version in Cargo.toml) but
# skips the tag/version gate and does not publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets

  build-linux:
    name: Linux (x86_64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz demoscope
          mv demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz $GITHUB_WORKSPACE/
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}
          name: linux-x86_64
          path: demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Tests run on the host target. The Linux build is covered by `verify`.
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\x86_64-pc-windows-msvc\release\demoscope.exe" `
            -DestinationPath "demoscope-${{ github.ref_name }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}
          name: windows-x86_64
          path: demoscope-${{ github.ref_name }}-windows-x86_64.zip

  build-macos:
    name: macOS (universal)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      # Tests run on the host (arm64) target; the x86_64 slice is built, not run.
      - name: Test
        run: cargo test --release
      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/demoscope \
            target/aarch64-apple-darwin/release/demoscope \
            -output demoscope-universal
      - name: Package
        run: |
          tar czf demoscope-${{ github.ref_name }}-macos-universal.tar.gz demoscope-universal
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}
          name: macos-universal
          path: demoscope-${{ github.ref_name }}-macos-universal.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the artifacts
        shell: bash
        run: |
          ls -l artifacts
          test "$(ls artifacts | wc -l | tr -d ' ')" -eq 3
      # The release body is the CHANGELOG section for this tag (the step fails
      # if there isn't one), not GitHub's auto-generated notes. A manual run has
      # no tag, so it uses the version in Cargo.toml.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "Release notes for $tag"
          ./scripts/release-notes.sh "$tag" > release-notes.md
          echo "title=$(./scripts/release-notes.sh --title "$tag")" >> "$GITHUB_OUTPUT"
          cat release-notes.md
      - name: Rehearsal complete
        if: github.event_name != 'push'
        run: echo "::notice title=Rehearsal::Verify, all builds, artifacts and release notes passed. Publishing was skipped (manual run)."
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: artifacts/*
