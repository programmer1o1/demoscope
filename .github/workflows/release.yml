name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets

  build-linux:
    name: Linux (x86_64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz demoscope
          mv demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz $GITHUB_WORKSPACE/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: demoscope-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\x86_64-pc-windows-msvc\release\demoscope.exe" `
            -DestinationPath "demoscope-${{ github.ref_name }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: demoscope-${{ github.ref_name }}-windows-x86_64.zip

  build-macos:
    name: macOS (universal)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/demoscope \
            target/aarch64-apple-darwin/release/demoscope \
            -output demoscope-universal
      - name: Package
        run: |
          tar czf demoscope-${{ github.ref_name }}-macos-universal.tar.gz demoscope-universal
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: demoscope-${{ github.ref_name }}-macos-universal.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The release body is the CHANGELOG section for this tag (the step fails
      # if there isn't one), not GitHub's auto-generated notes.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          echo "title=$(./scripts/release-notes.sh --title "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          cat release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: artifacts/*
