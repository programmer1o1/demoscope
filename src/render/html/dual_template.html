<style>
  :root {
    --bg:#0e0e12; --bg-deep:#08080b; --panel:#15151b; --grid:#1d1d25;
    --border:#2a2a34; --text:#ece9e2; --muted:#9a968c; --accent:#ffb000;
    --a:#ffb000; --b:#00e5cc;
    --font-display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-display);
         height:100vh; display:flex; flex-direction:column; overflow:hidden;
         -webkit-font-smoothing:antialiased; }
  #bar { display:flex; align-items:center; gap:12px; padding:9px 16px;
         background:linear-gradient(180deg,var(--panel),rgba(21,21,27,0.55));
         border-bottom:1px solid var(--border); flex:0 0 auto; }
  #bar .title { font-weight:800; letter-spacing:-0.02em; color:var(--text); font-size:15px; }
  #bar .title::first-letter { color:var(--accent); }
  #bar button { padding:6px 14px; background:var(--accent); color:var(--bg-deep); border:0; border-radius:3px;
                font-family:var(--font-mono); font-weight:600; cursor:pointer; font-size:12.5px; transition:filter .15s; }
  #bar button:hover { filter:brightness(1.08); }
  #bar button.sec { background:var(--grid); color:var(--text); border:1px solid var(--border); }
  #bar button.sec:hover { border-color:var(--accent); filter:none; }
  #scrub { flex:1; accent-color:var(--accent); height:3px; }
  #clock { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--muted); min-width:120px; text-align:right; font-size:12.5px; }
  #bar select { background:var(--grid); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:5px 8px; font-family:var(--font-mono); font-size:12px; }
  #panes { flex:1 1 auto; display:flex; min-height:0; }
  .pane { flex:1 1 50%; display:flex; flex-direction:column; min-width:0; }
  .pane + .pane { border-left:1px solid var(--border); }
  .pane .label { padding:6px 12px; font-family:var(--font-mono); font-size:11.5px; background:var(--panel); border-bottom:1px solid var(--border);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  .pane .label b { color:var(--text); font-weight:600; }
  .pane .tag { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:-1px; }
  iframe { flex:1 1 auto; border:0; width:100%; background:var(--bg); }
</style>
</head>
<body>
  <div id="bar">
    <svg width="18" height="18" viewBox="0 0 100 100" style="flex-shrink:0" aria-hidden="true">
      <defs><clipPath id="bar-ap"><circle cx="50" cy="50" r="39.5"/></clipPath></defs>
      <circle cx="50" cy="50" r="41" fill="none" stroke="#ece9e2" stroke-width="3.4"/>
      <g clip-path="url(#bar-ap)">
        <polyline points="38,62 38,42 64,42" fill="none" stroke="#ffb000" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M74,42 L65,37.5 L67.3,42 L65,46.5 Z" fill="#ffb000"/>
      </g>
    </svg>
    <span class="title">demoscope · diff</span>
    <button id="play">&#9654; Play</button>
    <button id="rew" class="sec" title="Rewind to start">&#9664;&#9664;</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="clock">0.0s / 0.0s</span>
    <select id="speed" title="Playback speed">
      <option value="0.25">0.25&times;</option>
      <option value="0.5">0.5&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="2">2&times;</option>
      <option value="4">4&times;</option>
    </select>
  </div>
  <div id="panes">
    <div class="pane">
      <div class="label" id="lblA"><span class="tag" style="background:#ffb000"></span><b>A</b></div>
      <iframe id="a" allow="fullscreen"></iframe>
    </div>
    <div class="pane">
      <div class="label" id="lblB"><span class="tag" style="background:#00e5cc"></span><b>B</b></div>
      <iframe id="b" allow="fullscreen"></iframe>
    </div>
  </div>
<script>
  // Each viewer is embedded as a base64 blob and loaded into an iframe with a
  // '#sync' fragment, which puts it in follower mode (it surrenders its clock).
  const A_B64 = "__VIEWER_A__";
  const B_B64 = "__VIEWER_B__";
  const NAME_A = "__NAME_A__";
  const NAME_B = "__NAME_B__";

  function blobUrl(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u], { type: 'text/html' })) + '#sync';
  }

  const fa = document.getElementById('a');
  const fb = document.getElementById('b');
  const meta = { a: null, b: null };

  document.getElementById('lblA').innerHTML =
    '<span class="tag" style="background:#ffb000"></span><b>A</b> &middot; ' + NAME_A;
  document.getElementById('lblB').innerHTML =
    '<span class="tag" style="background:#00e5cc"></span><b>B</b> &middot; ' + NAME_B;

  // Collect each follower's tick range / rate so the master clock can map a
  // shared "race second" onto each demo's own ticks (different length/rate ok).
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.type !== 'ds-ready') return;
    if (e.source === fa.contentWindow) meta.a = m;
    else if (e.source === fb.contentWindow) meta.b = m;
    // Re-seek to the current position once a side reports in.
    pushSeek();
  });

  fa.src = blobUrl(A_B64);
  fb.src = blobUrl(B_B64);

  // ── Master race-clock ───────────────────────────────────────────────────────
  let raceSec = 0, playing = false, speed = 1, lastTs = 0;
  const scrub = document.getElementById('scrub');
  const clock = document.getElementById('clock');
  const playBtn = document.getElementById('play');

  function totalSec() {
    return Math.max(meta.a ? meta.a.durationSec : 0, meta.b ? meta.b.durationSec : 0, 0.001);
  }
  function tickFor(m) {
    if (!m) return 0;
    let t = m.minTick + raceSec * m.tickRate;
    if (t > m.maxTick) t = m.maxTick;
    if (t < m.minTick) t = m.minTick;
    return t;
  }
  function pushSeek() {
    if (meta.a && fa.contentWindow) fa.contentWindow.postMessage({ type: 'ds-seek', tick: tickFor(meta.a) }, '*');
    if (meta.b && fb.contentWindow) fb.contentWindow.postMessage({ type: 'ds-seek', tick: tickFor(meta.b) }, '*');
  }
  function updUi() {
    const T = totalSec();
    scrub.value = Math.round((raceSec / T) * 1000);
    clock.textContent = raceSec.toFixed(1) + 's / ' + T.toFixed(1) + 's';
  }
  function updPlayBtn() { playBtn.innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play'; }

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!playing) { lastTs = ts; return; }
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    raceSec += dt * speed;
    const T = totalSec();
    if (raceSec >= T) { raceSec = T; playing = false; updPlayBtn(); }
    updUi();
    pushSeek();
  }
  requestAnimationFrame(loop);

  playBtn.onclick = () => {
    if (raceSec >= totalSec()) raceSec = 0;
    playing = !playing;
    lastTs = performance.now();
    updPlayBtn();
  };
  document.getElementById('rew').onclick = () => { raceSec = 0; updUi(); pushSeek(); };
  scrub.oninput = (e) => { raceSec = (e.target.value / 1000) * totalSec(); updUi(); pushSeek(); };
  document.getElementById('speed').onchange = (e) => { speed = parseFloat(e.target.value); };

  // Keyboard: space toggles play, arrows nudge.
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.onclick(); }
    else if (e.code === 'ArrowRight') { raceSec = Math.min(totalSec(), raceSec + 1); updUi(); pushSeek(); }
    else if (e.code === 'ArrowLeft') { raceSec = Math.max(0, raceSec - 1); updUi(); pushSeek(); }
  });
</script>
</body>
</html>
