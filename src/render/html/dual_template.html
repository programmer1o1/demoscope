<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demoscope · side-by-side</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23000'/><circle cx='16' cy='16' r='11' fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='15 4'/><path d='M9 20.5h4.5V16H18v-4.5h6' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#000; --panel:#0a0a0a; --grid:#161616; --border:#262626;
    --text:#f5f5f5; --muted:#8a8a8a; --faint:#4a4a4a; --accent:#fff;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --font-display:var(--font-mono);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  button, input, select { font:inherit; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-display);
         height:100vh; display:flex; flex-direction:column; overflow:hidden;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--text); color:#000; }

  #bar { display:flex; align-items:center; gap:12px; padding:8px 14px;
         border-bottom:1px solid var(--border); flex:0 0 auto; }
  #bar .title { font-weight:600; font-size:13px; letter-spacing:-0.01em; white-space:nowrap; }
  #bar .title span { color:var(--muted); font-weight:400; }
  #bar button { padding:5px 12px; background:var(--text); color:#000; border:1px solid var(--text);
                border-radius:2px; font-family:var(--font-mono); font-weight:500; cursor:pointer;
                font-size:12px; transition:background .12s, border-color .12s; }
  #bar button:hover { background:#fff; }
  #bar button.sec { background:transparent; color:var(--text); border-color:var(--border); }
  #bar button.sec:hover { border-color:#5a5a5a; }
  #bar button:focus-visible, #bar input:focus-visible, #bar select:focus-visible {
    outline:1px solid var(--accent); outline-offset:2px;
  }

  /* Monochrome range slider */
  #scrub { flex:1; -webkit-appearance:none; appearance:none; background:transparent; height:16px; margin:0; }
  #scrub::-webkit-slider-runnable-track { height:1px; background:var(--border); }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
                                 background:#fff; margin-top:-5px; cursor:pointer; }
  #scrub::-moz-range-track { height:1px; background:var(--border); }
  #scrub::-moz-range-progress { height:1px; background:#fff; }
  #scrub::-moz-range-thumb { width:11px; height:11px; border:0; border-radius:50%; background:#fff; cursor:pointer; }

  #clock { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--muted);
           min-width:120px; text-align:right; font-size:12px; }
  #bar select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:2px;
                padding:4px 8px; font-family:var(--font-mono); font-size:12px; cursor:pointer; }

  #panes { flex:1 1 auto; display:flex; min-height:0; }
  .pane { flex:1 1 50%; display:flex; flex-direction:column; min-width:0; }
  .pane + .pane { border-left:1px solid var(--border); }
  .pane .label { padding:6px 12px; font-family:var(--font-mono); font-size:11px;
                 border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; color:var(--muted); }
  .pane .label b { color:var(--text); font-weight:600; }
  .pane .tag { display:inline-block; width:8px; height:8px; margin-right:8px; vertical-align:0;
               background:#fff; border:1px solid #fff; }
  .pane .tag.hollow { background:transparent; }
  iframe { flex:1 1 auto; border:0; width:100%; background:var(--bg); }

  @media (max-width:760px) {
    #bar { gap:8px; padding:8px 10px; flex-wrap:wrap; }
    #bar .title { width:100%; }
    #scrub { order:2; flex-basis:100%; }
    #clock { margin-left:auto; min-width:100px; }
    #panes { flex-direction:column; }
    .pane { flex-basis:50%; }
    .pane + .pane { border-left:0; border-top:1px solid var(--border); }
  }
</style>
</head>
<body>
  <div id="bar">
    <svg width="16" height="16" viewBox="0 0 100 100" style="flex-shrink:0" aria-hidden="true">
      <circle cx="50" cy="50" r="43" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="56 11" transform="rotate(-3 50 50)"/>
      <path d="M25 66H42V52H60V37H85" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="title">demoscope <span>/ diff</span></span>
    <button id="play">&#9654; Play</button>
    <button id="rew" class="sec" title="Rewind to start">&#9664;&#9664;</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Race clock">
    <span id="clock">0.0s / 0.0s</span>
    <select id="speed" title="Playback speed">
      <option value="0.25">0.25&times;</option>
      <option value="0.5">0.5&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="2">2&times;</option>
      <option value="4">4&times;</option>
    </select>
  </div>
  <div id="panes">
    <div class="pane">
      <div class="label" id="lblA"></div>
      <iframe id="a" allow="fullscreen" title="Demo A"></iframe>
    </div>
    <div class="pane">
      <div class="label" id="lblB"></div>
      <iframe id="b" allow="fullscreen" title="Demo B"></iframe>
    </div>
  </div>
<script>
  // Each viewer is embedded as a base64 blob and loaded into an iframe with a
  // '#sync' fragment, which puts it in follower mode (it surrenders its clock).
  const A_B64 = "__VIEWER_A__";
  const B_B64 = "__VIEWER_B__";
  const NAME_A = "__NAME_A__";
  const NAME_B = "__NAME_B__";

  function blobUrl(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u], { type: 'text/html' })) + '#sync';
  }

  // Labels are built from text nodes: demo file names never reach innerHTML.
  function setLabel(id, letter, name, hollow) {
    const el = document.getElementById(id);
    const tag = document.createElement('span');
    tag.className = 'tag' + (hollow ? ' hollow' : '');
    const b = document.createElement('b');
    b.textContent = letter;
    el.replaceChildren(tag, b, document.createTextNode(' \u00b7 ' + name));
    el.title = name;
  }
  setLabel('lblA', 'A', NAME_A, false);
  setLabel('lblB', 'B', NAME_B, true);

  const fa = document.getElementById('a');
  const fb = document.getElementById('b');
  const meta = { a: null, b: null };

  // ── Master race-clock ───────────────────────────────────────────────────────
  let raceSec = 0, playing = false, speed = 1, lastTs = 0;
  const scrub = document.getElementById('scrub');
  const clock = document.getElementById('clock');
  const playBtn = document.getElementById('play');

  function totalSec() {
    return Math.max(meta.a ? meta.a.durationSec : 0, meta.b ? meta.b.durationSec : 0, 0.001);
  }
  function tickFor(m) {
    if (!m) return 0;
    let t = m.minTick + raceSec * m.tickRate;
    if (t > m.maxTick) t = m.maxTick;
    if (t < m.minTick) t = m.minTick;
    return t;
  }
  function pushSeek() {
    if (meta.a && fa.contentWindow) fa.contentWindow.postMessage({ type: 'ds-seek', tick: tickFor(meta.a) }, '*');
    if (meta.b && fb.contentWindow) fb.contentWindow.postMessage({ type: 'ds-seek', tick: tickFor(meta.b) }, '*');
  }
  function updUi() {
    const T = totalSec();
    scrub.value = Math.round((raceSec / T) * 1000);
    clock.textContent = raceSec.toFixed(1) + 's / ' + T.toFixed(1) + 's';
  }
  function updPlayBtn() { playBtn.innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play'; }
  function seekRace(sec) {
    raceSec = Math.max(0, Math.min(totalSec(), sec));
    updUi();
    pushSeek();
  }
  function togglePlay() {
    if (raceSec >= totalSec()) raceSec = 0;
    playing = !playing;
    lastTs = performance.now();
    updPlayBtn();
  }

  // Messages from the panes:
  //   ds-ready      → tick range / rate for the race-clock mapping
  //   ds-want-seek  → a local seek inside a pane; convert to race time, sync both
  //   ds-key        → Space pressed while a pane had focus
  //   demoscope:back (string) → Esc inside a pane; hand up to any embedding host
  window.addEventListener('message', (e) => {
    const side = e.source === fa.contentWindow ? 'a' : e.source === fb.contentWindow ? 'b' : null;
    if (!side) return;
    const m = e.data;
    if (m === 'demoscope:back') {
      if (window.parent && window.parent !== window) window.parent.postMessage('demoscope:back', '*');
      return;
    }
    if (!m || typeof m !== 'object') return;
    if (m.type === 'ds-ready') {
      meta[side] = m;
      updUi();
      pushSeek();
    } else if (m.type === 'ds-want-seek') {
      const src = meta[side];
      if (!src || !(src.tickRate > 0)) return;
      seekRace((m.tick - src.minTick) / src.tickRate);
    } else if (m.type === 'ds-key' && m.code === 'Space') {
      togglePlay();
    }
  });

  fa.src = blobUrl(A_B64);
  fb.src = blobUrl(B_B64);

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!playing) { lastTs = ts; return; }
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    raceSec += dt * speed;
    const T = totalSec();
    if (raceSec >= T) { raceSec = T; playing = false; updPlayBtn(); }
    updUi();
    pushSeek();
  }
  requestAnimationFrame(loop);

  playBtn.onclick = togglePlay;
  document.getElementById('rew').onclick = () => seekRace(0);
  scrub.oninput = (e) => seekRace((e.target.value / 1000) * totalSec());
  document.getElementById('speed').onchange = (e) => { speed = parseFloat(e.target.value); };

  // Keyboard (when the shell has focus): Space toggles, arrows nudge 1s.
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLSelectElement) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.target === scrub) return; // the slider handles its own arrows
    else if (e.code === 'ArrowRight') seekRace(raceSec + 1);
    else if (e.code === 'ArrowLeft') seekRace(raceSec - 1);
  });
</script>
</body>
</html>
