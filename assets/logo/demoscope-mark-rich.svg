<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Demoscope rich mark</title><desc id="desc">A luminous timeline aperture used for Demoscope artwork.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#202028"/><stop offset="1" stop-color="#08080b"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ece9e2" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect x="3" y="3" width="234" height="234" rx="48" fill="url(#bg)" stroke="#2a2a34" stroke-width="3"/>
  <rect x="4" y="4" width="232" height="232" rx="47" fill="url(#grid)"/>
  <path d="M70 153h34v-28h36V95h63" fill="none" stroke="#ffb000" stroke-width="12" opacity=".13" filter="url(#glow)"/>
  <g transform="translate(20 20) scale(2)">
    <circle cx="50" cy="50" r="43" fill="none" stroke="#ece9e2" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="56 11" transform="rotate(-3 50 50)"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#ece9e2" opacity=".14"/>
    <path d="M25 66H42V52H60V37H91" fill="none" stroke="#ffb000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="66" r="4" fill="#0e0e12" stroke="#ece9e2" stroke-width="2"/><circle cx="42" cy="52" r="2.5" fill="#ffd24a"/><circle cx="60" cy="37" r="2.5" fill="#ffd24a"/>
    <path d="m88 31 9 6-9 6z" fill="#ffb000"/>
  </g>
</svg>
