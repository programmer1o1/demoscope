    <circle cx="50" cy="50" r="35" fill="none" stroke="#ece9e2" opacity=".14"/>
    <path d="M25 66H42V52H60V37H91" fill="none" stroke="#ffb000" stroke-width="8" opacity=".11" filter="url(#glow)"/>
