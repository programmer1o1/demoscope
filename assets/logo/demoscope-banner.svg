  <path d="M335 253h519" stroke="#2a2a34"/>
  <g fill="none" stroke="#ffb000" stroke-width="2" opacity=".24"><path d="M829 119h48v34h43v-18h46v47h44v-29h43v52h54"/><path d="M829 273h40v-29h43v18h46v-54h44v23h43v-41h62" opacity=".45"/></g>
