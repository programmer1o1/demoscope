<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Demoscope</title><desc id="desc">Demoscope demo telemetry banner with timeline aperture logo.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191920"/><stop offset=".55" stop-color="#0e0e12"/><stop offset="1" stop-color="#08080b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ece9e2" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <path d="M53 32h116" stroke="#ffb000" stroke-width="3"/><text x="53" y="58" fill="#9a968c" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="2">ANALYSIS / VISUALIZATION</text>
  <text x="1147" y="58" text-anchor="end" fill="#9a968c" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="2">FORMAT 01</text>
