    <circle cx="25" cy="66" r="4" fill="#0e0e12" stroke="#ece9e2" stroke-width="2"/><circle cx="42" cy="52" r="2.5" fill="#ffd24a"/><circle cx="60" cy="37" r="2.5" fill="#ffd24a"/><path d="m88 31 9 6-9 6z" fill="#ffb000"/>
