    <rect x="335" y="279" width="108" height="30" rx="15" fill="#ffb000" fill-opacity=".1" stroke="#ffb000" stroke-opacity=".3"/><text x="389" y="298" text-anchor="middle" fill="#ffd24a">GOLDSRC</text>
    <rect x="453" y="279" width="88" height="30" rx="15" fill="#ece9e2" fill-opacity=".04" stroke="#ece9e2" stroke-opacity=".15"/><text x="497" y="298" text-anchor="middle" fill="#9a968c">SOURCE</text>
    <rect x="551" y="279" width="104" height="30" rx="15" fill="#ece9e2" fill-opacity=".04" stroke="#ece9e2" stroke-opacity=".15"/><text x="603" y="298" text-anchor="middle" fill="#9a968c">SOURCE 2</text>
